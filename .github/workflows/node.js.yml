name: Flow Ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version 22

      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --if-present

      - name: build docker
        run: docker build -t flowbackend .

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install dependencies
        run: npm ci

      - name: Build react
        run: npm run build

      - name: Build Docker
        run: docker build -t flowfrontend .
